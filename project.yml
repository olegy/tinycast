name: Tinycast
options:
  bundleIdPrefix: com.olegy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    # Tinycast Lite: the upstream version it is based on plus a Lite revision, e.g. 0.12.1-lite.1.
    # Bump the revision for every build installed with new changes and for every release.
    TINYCAST_UPSTREAM_VERSION: "0.12.1"
    TINYCAST_LITE_REVISION: "1"
    MARKETING_VERSION: "$(TINYCAST_UPSTREAM_VERSION)-lite.$(TINYCAST_LITE_REVISION)"
    CURRENT_PROJECT_VERSION: "$(TINYCAST_UPSTREAM_VERSION).$(TINYCAST_LITE_REVISION)"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # A stable self-signed identity keeps the Accessibility grant across rebuilds. docs/signing.md
    CODE_SIGN_IDENTITY: "Tinycast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    TINYCAST_BUNDLE_IDENTIFIER: com.olegy.tinycast
  configs:
    Debug:
      TINYCAST_BUNDLE_IDENTIFIER: com.olegy.tinycast.dev
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
        # Helper-only sources: compiling them in would link Vision and PDFKit into the app.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Features/FileSearch/Helper
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Tinycast/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # The crawl runs out of process, so its memory is returned when the helper exits.
      - target: FileIndexHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinycast/Tinycast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, so a local build never corrupts the installed app's state.
        Debug:
          PRODUCT_NAME: Tinycast Dev

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Tinycast/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # Pinned, or a PRODUCT_NAME override renames the binary `ClipboardTextWorker` looks for.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  FileIndexHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/FileSearch/Helper/FileIndexHelper.swift
      - Tinycast/Features/FileSearch/Model/FileSearchIgnoreList.swift
      - Tinycast/Features/FileSearch/Model/FileSearchPolicy.swift
      - Tinycast/Features/FileSearch/Model/FileSearchQuery.swift
      - Tinycast/Features/FileSearch/Model/FileSearchScope.swift
      - Tinycast/Features/FileSearch/Service/FileIndexCrawler.swift
      - Tinycast/Features/FileSearch/Service/FileIndexSnapshot.swift
    settings:
      base:
        # Pinned like ClipboardTextHelper's: a PRODUCT_NAME override would otherwise rename it.
        EXECUTABLE_NAME: FileIndexHelper
        PRODUCT_MODULE_NAME: FileIndexHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O
